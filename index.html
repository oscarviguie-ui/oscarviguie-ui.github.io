<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Keeps the page (and your résumé) out of search engines. Remove if you want it indexed. -->
<meta name="robots" content="noindex, nofollow">
<title>Oscar Viguié</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23111111'/><text x='50' y='64' font-family='Arial' font-size='40' font-weight='700' fill='white' text-anchor='middle'>OV</text></svg>">
<style>
  :root {
    --bg: #FFFFFF;
    --text: #111111;
    --muted: #5C5C5C;
    --line: #EAEAEA;
    --doc-line: #E6E6E6;
    --avatar: #EDEDED;
    --btn: #111111;
    --on-btn: #FFFFFF;
    --green: #1A7F4B;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --text: #F2F2F2;
      --muted: #A6A6A6;
      --line: #2E2E2E;
      --doc-line: #2E2E2E;
      --avatar: #2A2A2A;
      --btn: #F2F2F2;
      --on-btn: #121212;
      --green: #4CC585;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Layout ---------- */
  .layout {
    display: grid;
    gap: 2rem;
    padding: 2rem 1.25rem;
    padding-bottom: calc(6rem + env(safe-area-inset-bottom, 0px)); /* room for mobile bar */
    max-width: 40rem;
    margin: 0 auto;
    grid-template-areas: "side" "resume";
  }
  .side { grid-area: side; }
  .resume { grid-area: resume; min-width: 0; }

  @media (min-width: 900px) {
    .layout {
      max-width: none;
      grid-template-columns: minmax(0, 850px) 260px;
      grid-template-areas: "resume side";
      justify-content: center;
      gap: 3rem;
      padding: 2.5rem 2rem;
    }
    .side {
      position: sticky;
      top: 2.5rem;
      align-self: start;
      padding-top: .5rem;
    }
  }

  /* ---------- Profile ---------- */
  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--avatar);
    color: var(--muted);
    display: grid;
    place-items: center;
    font-size: 1.75rem;
    font-weight: 500;
    position: relative;
    overflow: hidden;
    margin-bottom: 1.25rem;
  }
  .avatar img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 25%; /* favours the face in portrait-shaped photos */
  }
  h1 {
    font-size: 1.625rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.2;
  }
  .field { color: var(--muted); margin-top: .25rem; }
  .status {
    display: flex;
    align-items: center;
    gap: .5rem;
    margin-top: .75rem;
    color: var(--green);
    font-size: .9375rem;
    font-weight: 500;
  }
  .status::before {
    content: "";
    width: .5rem;
    height: .5rem;
    border-radius: 50%;
    background: var(--green);
  }

  .actions { display: grid; gap: .5rem; margin-top: 1.75rem; }
  .btn {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 2.75rem;
    padding: 0 1rem;
    border-radius: 8px;
    font-size: .9375rem;
    font-weight: 500;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .15s, background-color .15s;
  }
  .btn-primary { background: var(--btn); color: var(--on-btn); }
  .btn-primary:hover { opacity: .85; }
  .btn-secondary { box-shadow: inset 0 0 0 1px var(--btn); color: var(--text); }
  .btn-secondary:hover { background: var(--line); }

  .contact {
    margin-top: 1.75rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--line);
  }
  .contact h2 { font-size: .9375rem; font-weight: 600; margin-bottom: .75rem; }
  .contact dl { display: grid; gap: .625rem; }
  .contact dt { font-size: .8125rem; color: var(--muted); }
  .contact dd { font-size: .9375rem; }
  .contact a {
    color: var(--text);
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .contact a:hover { text-decoration: underline; text-underline-offset: .2em; }

  a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  /* ---------- Résumé ---------- */
  .resume-pages { display: grid; gap: 1rem; }
  .page {
    display: block;
    width: 100%;
    height: auto;
    background: #fff;
    border: 1px solid var(--doc-line);
    border-radius: 4px;
  }
  .page.pdf-frame {
    height: calc(100vh - 5rem);
    min-height: 600px;
  }
  .resume-note {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 2rem 1.5rem;
    text-align: center;
    color: var(--muted);
  }
  .resume-note a { color: var(--text); font-weight: 500; }

  /* ---------- Mobile bar: always reachable while scrolling the résumé ---------- */
  .bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: .5rem;
    padding: .625rem 1rem calc(.625rem + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    border-top: 1px solid var(--line);
  }
  @media (min-width: 900px) { .bar { display: none; } }
</style>
</head>
<body>
<div class="layout">

  <aside class="side">
    <!-- Shows photo.jpg if it exists in the repo; otherwise falls back to initials -->
    <div class="avatar">
      <span aria-hidden="true">OV</span>
      <img src="photo.jpg" alt="Oscar Viguie" onerror="this.remove()">
    </div>
    <h1>Oscar Viguié</h1>
    <p class="field">Energy Economics</p>

    <div class="actions">
      <a class="btn btn-primary" href="https://www.linkedin.com/in/oscar-viguie/" target="_blank" rel="noopener">LinkedIn</a>
      <a class="btn btn-secondary" href="resume.pdf" download="Oscar-Viguie-Resume.pdf">Download résumé</a>
    </div>

    <div class="contact">
      <h2>Contact Info</h2>
      <dl>
        <div>
          <dt>Email</dt>
          <dd><a href="mailto:oscar.viguie@gmail.com">oscar.viguie@gmail.com</a></dd>
        </div>
        <div>
          <dt>Phone</dt>
          <dd><a href="tel:+33759625766">07 59 62 57 66</a></dd>
        </div>
        <div>
          <dt>LinkedIn</dt>
          <dd><a href="https://www.linkedin.com/in/oscar-viguie/" target="_blank" rel="noopener">linkedin.com/in/oscar-viguie</a></dd>
        </div>
      </dl>
    </div>
  </aside>

  <main class="resume" aria-label="Résumé">
    <div id="resume-pages" class="resume-pages">
      <p class="resume-note">Loading résumé…</p>
    </div>
  </main>

</div>

<nav class="bar" aria-label="Quick contact">
  <a class="btn btn-primary" href="https://www.linkedin.com/in/oscar-viguie/" target="_blank" rel="noopener">LinkedIn</a>
  <a class="btn btn-secondary" href="mailto:oscar.viguie@gmail.com">Email</a>
  <a class="btn btn-secondary" href="tel:+33759625766">Call</a>
</nav>

<!-- Desktop: the browser's own PDF viewer (vector text, pin-sharp, links clickable).
     Phones: PDF.js draws each page at high resolution, since mobile browsers can't embed PDFs properly. -->
<script>
  (function () {
    const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    const container = document.getElementById('resume-pages');
    const wide = window.matchMedia('(min-width: 900px)');
    let libPromise = null, docPromise = null, lastWidth = 0, renderId = 0;

    function showNative() {
      lastWidth = 0;
      container.innerHTML =
        '<iframe class="page pdf-frame" src="resume.pdf#toolbar=0&navpanes=0&view=FitH" title="Résumé"></iframe>';
    }
    function showLink() {
      container.innerHTML =
        '<p class="resume-note"><a href="resume.pdf" target="_blank" rel="noopener">Open my résumé (PDF)</a></p>';
    }

    function loadLib() {
      if (!libPromise) {
        libPromise = new Promise((resolve, reject) => {
          const sc = document.createElement('script');
          sc.src = PDFJS + 'pdf.min.js';
          sc.crossOrigin = 'anonymous';
          sc.onload = () => {
            pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
            resolve();
          };
          sc.onerror = reject;
          document.head.appendChild(sc);
        });
      }
      return libPromise;
    }
    function loadDoc() {
      if (!docPromise) docPromise = loadLib().then(() => pdfjsLib.getDocument('resume.pdf').promise);
      return docPromise;
    }

    async function renderCanvas() {
      if (wide.matches) return;
      const width = container.clientWidth;
      if (Math.abs(width - lastWidth) < 2) return;
      lastWidth = width;
      const id = ++renderId;
      const pdf = await loadDoc();
      // Oversample: at least 2x, up to 4x, so text stays crisp after the browser scales it
      const q = Math.min(Math.max((window.devicePixelRatio || 1) * 1.5, 2), 4);
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const base = page.getViewport({ scale: 1 });
        const viewport = page.getViewport({ scale: (width / base.width) * q });
        const canvas = document.createElement('canvas');
        canvas.className = 'page';
        canvas.width = Math.floor(viewport.width);
        canvas.height = Math.floor(viewport.height);
        canvas.setAttribute('role', 'img');
        canvas.setAttribute('aria-label', 'Résumé page ' + i);
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        if (id !== renderId || wide.matches) return;
        pages.push(canvas);
      }
      container.replaceChildren(...pages);
    }

    function start() {
      if (wide.matches) { showNative(); return; }
      const timer = setTimeout(() => { if (!lastWidth || container.querySelector('.resume-note')) showLink(); }, 10000);
      renderCanvas().then(() => clearTimeout(timer)).catch(() => { clearTimeout(timer); showLink(); });
    }

    start();
    wide.addEventListener('change', start);
    let t;
    window.addEventListener('resize', () => {
      clearTimeout(t);
      t = setTimeout(() => { if (!wide.matches) renderCanvas().catch(() => {}); }, 200);
    });
  })();
</script>
</body>
</html>
